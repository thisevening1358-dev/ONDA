<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html,body{margin:0;padding:0;height:100%}body{background:#e9e7ef}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>ONDA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#dcdff0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app/style.css">
</head>
<body>
<div id="app">
  <div class="air" aria-hidden="true"><i class="mist"></i><i class="aurora"></i><i class="floor"></i></div>

  <div id="shell">
    <header class="top">
      <span class="logo">ONDA</span>
      <div class="actions">
        <button class="icon-btn" id="openCollection" type="button" aria-label="오브제 도감" data-icon="squares"></button>
        <button class="icon-btn" id="mode" type="button" aria-label="다크 모드" data-icon="moon"></button>
        <button class="icon-btn" id="openMenu" type="button" aria-label="메뉴" aria-expanded="false" data-icon="list"></button>
      </div>
    </header>

    <main class="stage" id="stage" aria-label="오브제 공간. 끌어서 돌려보고, 톡 누르면 튀어 올라요.">
      <div class="halo" aria-hidden="true"></div>
      <canvas id="gl" role="img" aria-label="켜진 소리들이 합쳐진 오브제"></canvas>
      <button class="float raised press" id="timerPill" type="button" hidden><span data-icon="timer"></span><span id="timerText"></span></button>
      <div class="float raised" id="toast" role="status" hidden><span data-icon="sparkle"></span><span>새 오브제를 찾았어요</span><span class="count" id="toastCount"></span></div>
      <div class="caption" id="caption" aria-live="polite"><strong id="capName"></strong><span id="capParts"></span><em id="capHint" hidden>끌어서 360도로 돌려보세요</em></div>
    </main>

    <section class="mixer" id="mixer" aria-label="믹서">
      <div id="rows"></div>
      <div class="mixer-foot"><button class="text-btn" id="allOff" type="button">모두 끄기</button></div>
    </section>

    <div class="swipe" id="swipe" aria-label="위로 쓸어 올리면 앱을 닫아도 소리가 계속 나와요" data-icon="up"></div>
  </div>

  <div class="veil" id="veil" hidden></div>

  <div class="pop glass" id="menu" role="dialog" aria-label="메뉴" hidden>
    <div class="pop-sec"><div class="themes" id="themes" role="radiogroup" aria-label="테마"></div></div>
    <div class="pop-sec"><span class="cap">슬립 타이머</span><div class="choices" id="timerChoices" role="radiogroup" aria-label="슬립 타이머"></div></div>
    <div class="pop-sec"><span class="cap">프리셋</span><div class="presets" id="presets"></div></div>
    <div class="expand" id="saveExpand"><div><div class="save-panel">
      <h3>새 프리셋</h3>
      <label class="cap" for="presetName">이름</label>
      <input class="field sunken" id="presetName" maxlength="16" autocomplete="off">
      <span class="cap">아이콘</span>
      <div class="icon-pick" id="iconPick" role="radiogroup" aria-label="아이콘"></div>
      <p class="hint" id="saveHint" hidden>소리를 하나 이상 켜면 저장할 수 있어요</p>
      <div class="save-actions"><button class="cancel" id="saveCancel" type="button">취소</button><button class="wide-btn raised press" id="saveConfirm" type="button">저장</button></div>
    </div></div></div>
    <button class="wide-btn raised press" id="saveOpen" type="button"><span data-icon="plus"></span>지금 믹스 저장</button>
  </div>

  <div class="pop glass" id="texture" role="dialog" aria-label="소리 결" hidden>
    <h3 id="texTitle"></h3>
    <div class="choices" id="texChoices" role="radiogroup"></div>
  </div>

  <section id="collection" aria-label="오브제 도감" hidden>
    <div class="col-top"><button class="icon-btn" id="closeCollection" type="button" aria-label="닫기" data-icon="back"></button><span>오브제 도감</span><span class="count" id="colCount"></span></div>
    <div class="col-head"><h2 id="colTitle"></h2><p>모양을 보면 어떤 소리를 섞었는지 알 수 있어요</p></div>
    <div id="groups"></div>
  </section>

  <section id="lock" aria-label="잠금 화면" hidden>
    <img class="lock-art" id="lockArt" alt="">
    <div class="lock-clock lock-dim"><small id="lockDate"></small><b id="lockTime"></b></div>
    <div class="lock-list night" id="lockList" hidden><div class="cap">프리셋</div><div id="lockPresets"></div><div class="cap">슬립 타이머</div><div class="choices lock-timer" id="lockTimer" role="radiogroup" aria-label="슬립 타이머"></div></div>
    <div class="player night">
      <div class="now">
        <button class="open-app" id="openApp" type="button" aria-label="ONDA 열기"><img id="lockThumb" alt=""><span><b id="lockTitle"></b><small id="lockSub"></small></span></button>
        <button class="round" id="lockListBtn" type="button" aria-label="프리셋 고르기" data-icon="list"></button>
      </div>
      <div class="controls">
        <button id="prevPreset" type="button" aria-label="이전 프리셋" data-icon="prev"></button>
        <button class="play" id="playPause" type="button" aria-label="일시정지" data-icon="pause"></button>
        <button id="nextPreset" type="button" aria-label="다음 프리셋" data-icon="next"></button>
      </div>
    </div>
    <div class="lock-bar"></div>
  </section>
</div>

<div id="intro" aria-hidden="true">
  <i class="fog" style="width:70%;height:40%;left:-10%;top:10%;--fx:-40%;--fy:-30%"></i>
  <i class="fog" style="width:80%;height:46%;right:-20%;top:40%;--fx:45%;--fy:10%"></i>
  <i class="fog" style="width:90%;height:40%;left:5%;bottom:-10%;--fx:-10%;--fy:50%"></i>
  <span class="word">ONDA</span>
</div>

<script>
  // a safety net: whatever happens in the app script, the fog lifts
  (function () {
    var lift = function () { var i = document.getElementById('intro'); if (!i || i.classList.contains('lift')) return; i.classList.add('lift'); setTimeout(function () { i.remove(); }, 2500); };
    window.__ondaLift = lift;
    setTimeout(lift, 6000);
    window.addEventListener('error', function () { setTimeout(lift, 300); });
    window.addEventListener('unhandledrejection', function () { setTimeout(lift, 300); });
  })();
</script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",

} }
</script>
<script type="module">
import * as THREE from 'three';
import { mergeVertices, mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
const GEO_WORKER_SRC = "import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.169.0/+esm';\nimport { mergeVertices, mergeGeometries } from 'https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/utils/BufferGeometryUtils.js/+esm';\nimport { RoundedBoxGeometry } from 'https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/geometries/RoundedBoxGeometry.js/+esm';\n/* ONDA shapes: the milky material and every object's geometry, for all three themes.\n   Built from \ubabd\ud658 \uc624\ube0c\uc81c/index.html (material, helpers, nature set) and \uc0c8 \uc624\ube0c\uc81c/*.js (city and noise sets). */\n// mesh resolution: objects render small on a phone, so touch devices build lighter meshes\nconst GEO_Q = __GEO_Q__;\nconst reduceMotion = false;\nconst MO = reduceMotion ? 0.3 : 1;\nconst clamp = (v, a, b) => Math.min(b, Math.max(a, v));\nconst V2 = (x, y) => new THREE.Vector2(x, y), V3 = (x, y, z) => new THREE.Vector3(x, y, z);\n\n// The four sounds. Each object is a milky body with two soft lights inside it (pos = height 0..1, rad = size vs the object)\nconst TRACKS = [\n  { id: 'fire', label: 'FIRE', ko: '\ubaa8\ub2e5\ubd88', color: '#ff6a2b', body: '#fff3ea', rim: '#ffd8c6',\n    glowA: '#ff3b2f', posA: 0.66, radA: 0.4, glowB: '#ffc65a', posB: 0.28, radB: 0.55 },\n  { id: 'wave', label: 'WAVE', ko: '\ud30c\ub3c4', color: '#1fa8e8', body: '#eef7ff', rim: '#cde2ff',\n    glowA: '#2fc2ff', posA: 0.35, radA: 0.55, glowB: '#a18aff', posB: 0.8, radB: 0.38 },\n  { id: 'wind', label: 'WIND', ko: '\ubd04\ubc14\ub78c', color: '#46c983', body: '#f2fbf2', rim: '#d3f0dd',\n    glowA: '#3fdc98', posA: 0.55, radA: 0.5, glowB: '#fff07a', posB: 0.2, radB: 0.42 },\n  { id: 'rain', label: 'RAIN', ko: '\ube57\uc18c\ub9ac', color: '#7088ff', body: '#f1f1ff', rim: '#d8dbff',\n    glowA: '#566bff', posA: 0.26, radA: 0.52, glowB: '#ff9bd4', posB: 0.72, radB: 0.3 },\n];\n// What two or more sounds become. Keys list the sounds in TRACKS order.\nconst COMBOS = {\n  'fire+wave':      { name: '\ubb3c\uc548\uac1c', body: '#f6f3f8', rim: '#e2dcea', glowA: '#ffa985', posA: 0.2, radA: 0.46, glowB: '#a8e6ff', posB: 0.82, radB: 0.46 },\n  'fire+wind':      { name: '\ubd88\uc528', body: '#fff1e8', rim: '#f2d4c6', glowA: '#ff4a2b', posA: 0.16, radA: 0.42, glowB: '#ffc65a', posB: 0.78, radB: 0.42 },\n  'fire+rain':      { name: '\uaebc\uc9c4 \ubaa8\ub2e5\ubd88', body: '#f2eef2', rim: '#dcd6e2', glowA: '#ff5a3a', posA: 0.14, radA: 0.26, glowB: '#b8b2dc', posB: 0.72, radB: 0.5 },\n  'wave+wind':      { name: '\ubb3c\ubcf4\ub77c', body: '#effaff', rim: '#cfe9ff', glowA: '#38c8ff', posA: 0.32, radA: 0.5, glowB: '#86f0cf', posB: 0.86, radB: 0.36 },\n  'wave+rain':      { name: '\ube57\ubc29\uc6b8 \ubb3c\uacb0', body: '#eff2ff', rim: '#d3dbff', glowA: '#4d7bff', posA: 0.4, radA: 0.5, glowB: '#c5a8ff', posB: 0.82, radB: 0.35 },\n  'wind+rain':      { name: '\ube44\ubc14\ub78c', body: '#f1f3ff', rim: '#d6dcff', glowA: '#7d8cff', posA: 0.72, radA: 0.5, glowB: '#7ef0b8', posB: 0.12, radB: 0.42 },\n  'fire+wave+wind': { name: '\ub178\uc744', body: '#fff3ee', rim: '#f2d6e6', glowA: '#ff6a3d', posA: 0.72, radA: 0.4, glowB: '#8a7dff', posB: 0.16, radB: 0.5 },\n  'fire+wave+rain': { name: '\uc628\ucc9c', body: '#f4f6ff', rim: '#dbe3f7', glowA: '#5fd8ff', posA: 0.25, radA: 0.5, glowB: '#ffb09a', posB: 0.82, radB: 0.4 },\n  'fire+wind+rain': { name: '\ubb34\uc9c0\uac1c', body: '#fbf8ff', rim: '#e8e0f7', glowA: '#ffd1e6', posA: 0.15, radA: 0.3, glowB: '#c9e6ff', posB: 0.15, radB: 0.3, rainbow: 1 },\n  'wave+wind+rain': { name: '\ud3ed\ud48d', body: '#eef0ff', rim: '#cfd4f5', glowA: '#4f55ff', posA: 0.5, radA: 0.38, glowB: '#6fe0ff', posB: 0.2, radB: 0.6 },\n  'fire+wave+wind+rain': { name: '\uc791\uc740 \ud589\uc131', body: '#f7f4ff', rim: '#dcd9f2', glowA: '#ff8a5a', posA: 0.72, radA: 0.45, glowB: '#4f9dff', posB: 0.32, radB: 0.45 },\n};\n\n\n/* ---------- Material: a milky, velvet body lit from inside ----------\n   The skin is near white and matte. Two soft lights inside show through it, strongest where the body is thick\n   (facing you) and fading toward the edges. The silhouette itself fades out, so every shape dissolves into the air.\n   The rainbow form colours its arc in bands instead. */\nconst U = { time: { value: 0 }, dark: { value: 0 } };\nfunction dreamMat(t, geo, { deform = '', amp, hit }) {\n  const box = geo.boundingBox, bs = geo.boundingSphere, h = box.max.y - box.min.y;\n  const cx = (box.min.x + box.max.x) / 2, cz = (box.min.z + box.max.z) / 2 + bs.radius * 0.12;\n  return new THREE.ShaderMaterial({\n    transparent: true, depthWrite: false,\n    uniforms: {\n      uTime: U.time, uDark: U.dark, uAmp: amp, uHit: hit, uRainbow: { value: t.rainbow || 0 },\n      uY: { value: V2(box.min.y, box.max.y) },\n      uBody: { value: new THREE.Color(t.body) }, uRim: { value: new THREE.Color(t.rim) },\n      uGA: { value: new THREE.Color(t.glowA) }, uGB: { value: new THREE.Color(t.glowB) },\n      uPA: { value: V3(cx, box.min.y + h * t.posA, cz) }, uPB: { value: V3(cx, box.min.y + h * t.posB, cz) },\n      uRA: { value: bs.radius * t.radA * 1.4 }, uRB: { value: bs.radius * t.radB * 1.4 },\n    },\n    vertexShader: `uniform float uTime; uniform float uAmp; uniform float uHit; uniform vec2 uY;\n      varying vec3 vP; varying vec3 vN; varying vec3 vV;\n      void main() {\n        vec3 transformed = position; vec3 objectNormal = normal;\n        float hgt = clamp((position.y - uY.x) / (uY.y - uY.x), 0.0, 1.0);\n        ${deform}\n        // soft wobble after a merge, like a balloon settling\n        float jelly = sin(position.y * 5.0 + uTime * 9.0) * 0.6 + sin(position.x * 4.0 - uTime * 7.0) * 0.4 + sin(position.z * 4.5 + uTime * 8.0) * 0.3;\n        transformed += objectNormal * jelly * uHit * 0.06;\n        vP = position;\n        vec4 mv = modelViewMatrix * vec4(transformed, 1.0);\n        vV = -mv.xyz; vN = normalize(normalMatrix * objectNormal);\n        gl_Position = projectionMatrix * mv;\n      }`,\n    fragmentShader: `uniform vec3 uBody; uniform vec3 uRim; uniform vec3 uGA; uniform vec3 uGB; uniform vec3 uPA; uniform vec3 uPB;\n      uniform float uRA; uniform float uRB; uniform float uDark; uniform float uRainbow;\n      varying vec3 vP; varying vec3 vN; varying vec3 vV;\n      vec3 hsv2rgb(vec3 c) { vec3 p = abs(fract(c.xxx + vec3(0.0, 2.0 / 3.0, 1.0 / 3.0)) * 6.0 - 3.0); return c.z * mix(vec3(1.0), clamp(p - 1.0, 0.0, 1.0), c.y); }\n      void main() {\n        vec3 n = normalize(vN), v = normalize(vV);\n        float facing = clamp(dot(n, v), 0.0, 1.0);\n        float lit = 0.66 + 0.24 * clamp(dot(n, normalize(vec3(-0.5, 0.8, 0.6))), 0.0, 1.0);   // one wide, soft key light\n        vec3 col = mix(uRim, uBody, smoothstep(0.0, 0.7, facing)) * lit * mix(1.0, 0.34, uDark);\n        float depth = mix(0.3, 1.0, facing);   // the inner light shows most through the thick middle\n        if (uRainbow > 0.5) {\n          float band = clamp((length(vP.xy) - 0.76) / 0.48, 0.0, 1.0);\n          col = mix(col, hsv2rgb(vec3(0.84 - band * 0.84, 0.5, 1.0)) * mix(1.0, 0.7, uDark), 0.8 * depth * step(0.0, vP.y + 0.05));\n        }\n        float a = exp(-pow(distance(vP, uPA) / uRA, 2.0)) * depth;\n        float b = exp(-pow(distance(vP, uPB) / uRB, 2.0)) * depth;\n        col = mix(col, uGA, a * 0.95); col = mix(col, uGB, b * 0.9);\n        col += (uGA * a + uGB * b) * mix(0.06, 0.14, uDark);\n        float alpha = smoothstep(0.02, 0.55, facing);   // the silhouette dissolves instead of ending in a hard edge\n        gl_FragColor = vec4(col, alpha);\n        #include <colorspace_fragment>\n      }`,\n  });\n}\n\n/* ---------- Geometry helpers: soft solids shrink-wrapped from signed distance fields ---------- */\nfunction editVerts(g, fn) { const p = g.attributes.position, v = V3(); for (let i = 0; i < p.count; i++) { v.fromBufferAttribute(p, i); fn(v, i); p.setXYZ(i, v.x, v.y, v.z); } p.needsUpdate = true; return g; }\nfunction smooth(g) { g.deleteAttribute('uv'); g.deleteAttribute('normal'); const o = mergeVertices(g, 1e-4); o.computeVertexNormals(); return o; }\nfunction merge(...gs) { return mergeGeometries(gs.map((g) => { if (g.attributes.uv) g.deleteAttribute('uv'); if (g.attributes.uv1) g.deleteAttribute('uv1'); return g; })); }\nconst smin = (a, b, k) => { const h = Math.max(k - Math.abs(a - b), 0) / k; return Math.min(a, b) - h * h * k * 0.25; };\nconst sph = (x, y, z, cx, cy, cz, r, sy = 1, sz = 1) => Math.hypot(x - cx, (y - cy) / sy, (z - cz) / sz) - r;\nconst blobs = (list, k) => (x, y, z) => { let d = 1e9; for (const b of list) d = smin(d, sph(x, y, z, ...b), k); return d; };\n// iq's round cone: sphere r1 at the base, sphere r2 at height h, tilted by `tilt` around z\nfunction roundCone(x, y, z, bx, by, r1, r2, h, tilt = 0, zs = 1) {\n  const px = x - bx, py = y - by, c = Math.cos(tilt), s = Math.sin(tilt);\n  const rx = px * c + py * s, ry = -px * s + py * c, rz = z / zs;\n  const qx = Math.hypot(rx, rz), qy = ry, b = (r1 - r2) / h, a = Math.sqrt(1 - b * b), k = -b * qx + a * qy;\n  if (k < 0) return Math.hypot(qx, qy) - r1;\n  if (k > a * h) return Math.hypot(qx, qy - h) - r2;\n  return qx * a + qy * b - r1;\n}\nfunction shrinkWrap(sdf, { center = [0, 0, 0], seg = [150, 110], rMax = 2.6 } = {}) {\n  const g = new THREE.SphereGeometry(1, Math.max(24, Math.round(seg[0] * GEO_Q)), Math.max(16, Math.round(seg[1] * GEO_Q))), c = V3(...center), d = V3();\n  const f = (t) => sdf(c.x + d.x * t, c.y + d.y * t, c.z + d.z * t);\n  editVerts(g, (v) => {\n    d.copy(v).normalize();\n    let t = rMax, s = f(t);\n    while (t > 0 && s > 0) { t -= Math.max(s * 0.8, 0.003); s = f(t); }   // outermost surface along the ray\n    let lo = Math.max(t, 0), hi = lo + 0.02;\n    for (let i = 0; i < 14; i++) { const m = (lo + hi) / 2; if (f(m) < 0) lo = m; else hi = m; }\n    v.copy(d).multiplyScalar(lo).add(c);\n  });\n  return smooth(g);\n}\n// a tube along a path whose thickness follows radius(u), u = 0..1 from start to end\nfunction taperTube(points, radius, { T = 260, R = 30, zs = 1.3 } = {}) {\n  T = Math.max(40, Math.round(T * GEO_Q)); R = Math.max(10, Math.round(R * GEO_Q));\n  const path = new THREE.CatmullRomCurve3(points.map((p) => V3(...p)));\n  const g = new THREE.TubeGeometry(path, T, 1, R, false), c = V3();\n  editVerts(g, (v, k) => { const u = Math.floor(k / (R + 1)) / T; path.getPointAt(u, c); v.sub(c).multiplyScalar(radius(u)); v.z *= zs; v.add(c); });\n  return smooth(g);\n}\nconst cap = (u, a, b) => Math.sqrt(Math.max(0, 1 - Math.pow(Math.max(0, u - a) / (1 - a), 2))) * Math.min(1, u / b);   // round ends\n\n/* ---------- The four sounds ---------- */\nfunction waveGeo(stretch = 1) {\n  const s = new THREE.Shape();\n  s.moveTo(-1.14, -0.4); s.lineTo(0.85, -0.42);\n  s.splineThru([V2(0.92, -0.3), V2(0.9, -0.1), V2(0.78, 0.1), V2(0.7, 0.32), V2(0.74, 0.52), V2(0.86, 0.6), V2(0.98, 0.56), V2(1.02, 0.44),\n    V2(1.14, 0.5), V2(1.16, 0.7), V2(1.04, 0.88), V2(0.82, 0.96), V2(0.56, 0.9), V2(0.3, 0.7), V2(0.0, 0.4), V2(-0.4, 0.12), V2(-0.82, -0.14), V2(-1.14, -0.33)]);\n  s.closePath();\n  const g = new THREE.ExtrudeGeometry(s, { depth: 0.28, bevelEnabled: true, bevelThickness: 0.32, bevelSize: 0.2, bevelSegments: 8, curveSegments: 8, steps: 2 });\n  editVerts(g, (v) => { v.x *= 0.82; v.y *= stretch; v.z -= 0.14; v.z *= 1 + 0.25 * Math.cos(v.x * 1.4); });\n  return smooth(g);\n}\nfunction cloudGeo(scale = 1) {\n  return shrinkWrap(blobs([[0, 0, 0, 0.52, 1, 0.8], [-0.56, -0.1, 0, 0.38, 1, 0.8], [0.58, -0.08, 0.02, 0.4, 1, 0.8],\n    [-0.22, 0.3, 0, 0.42, 1, 0.8], [0.26, 0.26, -0.02, 0.38, 1, 0.8], [0, -0.06, 0.18, 0.42, 1, 0.8]].map((b) => [b[0] * scale, b[1] * scale, b[2] * scale, b[3] * scale, b[4], b[5]]), 0.26 * scale));\n}\nconst SINGLE = {\n  fire: () => shrinkWrap((x, y, z) => {\n    let d = roundCone(x, y, z, 0.04, -0.4, 0.5, 0.07, 1.45, 0.08, 0.9);\n    d = smin(d, roundCone(x, y, z, -0.3, -0.3, 0.3, 0.07, 0.98, 0.34, 0.9), 0.2);\n    return smin(d, roundCone(x, y, z, 0.34, -0.36, 0.28, 0.07, 0.8, -0.38, 0.9), 0 at the bottom, 1 at the top)\nconst DEFORM = {\n  fire: `transformed.x += sin(uTime * 1.3 + position.y * 1.8) * 0.07 * hgt * hgt * uAmp;\n         transformed.z += cos(uTime * 1.05 + position.y * 1.5) * 0.05 * hgt * hgt * uAmp;`,\n  wave: `transformed.y += sin(position.x * 2.6 - uTime * 1.4) * 0.05 * hgt * uAmp;\n         transformed.x += sin(uTime * 0.9) * 0.04 * hgt * hgt * uAmp;`,\n  wind: `transformed.xy += normalize(position.xy + 0.001) * sin(length(position.xy) * 9.0 - uTime * 2.2) * 0.022 * uAmp;`,\n  rain: `transformed.y *= 1.0 + 0.04 * sin(uTime * 2.2) * uAmp;\n         transformed.xz *= 1.0 - 0.02 * sin(uTime * 2.2) * uAmp;`,\n  combo: `transformed += objectNormal * sin(uTime * 1.2 + position.y * 2.2 + position.x * 1.3) * 0.02 * uAmp;`,\n};\n\n\n/* ---------- New sounds: CITY (\ub3c4\uc2ec) and NOISE (\ud654\uc774\ud2b8 \ub178\uc774\uc988) ----------\n   Same material as the nature set: a milky body with two soft lights inside (pos = height 0..1, rad = size vs the object).\n   Needs the helpers from \ubabd\ud658 \uc624\ube0c\uc81c/index.html: smin, sph, roundCone, shrinkWrap, smooth, merge, cloudGeo. */\nconst NEW_TRACKS = [\n  // CITY\n  { id: 'coffee', label: 'COFFEE', ko: '\ucee4\ud53c \ub0b4\ub9ac\uae30', theme: 'city', body: '#fff4ea', rim: '#f0dccb',\n    glowA: '#c9784a', posA: 0.22, radA: 0.5, glowB: '#ffd99c', posB: 0.82, radB: 0.42 },\n  { id: 'train', label: 'TRAIN', ko: '\ubc24\uae30\ucc28', theme: 'city', body: '#f3f2ff', rim: '#dadcf6',\n    glowA: '#ffcf5e', posA: 0.62, radA: 0.42, glowB: '#6f7dff', posB: 0.12, radB: 0.5 },\n  { id: 'typing', label: 'TYPING', ko: '\ud0c0\uc790 \uc18c\ub9ac', theme: 'city', body: '#f4f6ff', rim: '#d9dff2',\n    glowA: '#8fb0ff', posA: 0.35, radA: 0.5, glowB: '#ffb8dc', posB: 0.85, radB: 0.36 },\n  { id: 'page', label: 'PAGE', ko: '\ucc45\uc7a5 \ub118\uae30\uae30', theme: 'city', body: '#fffaf1', rim: '#efe3d2',\n    glowA: '#ffc16e', posA: 0.45, radA: 0.48, glowB: '#9fc2ff', posB: 0.9, radB: 0.34 },\n  // N h.PI);\n  s.lineTo(x, y + r); s.absarc(x + r, y + r, r, Math.PI, Math.PI * 1.5); return s;\n}\n\nconst NEW_SHAPES = {\n  // a drip cone sitting on a round cup, with a little handle\n  coffee: () => merge(\n    shrinkWrap((x, y, z) => {\n      // the dripper is a cone cut flat at the top, with a soft rim\n      const cone = smax(roundCone(x, y, z, 0, -0.08, 0.14, 0.5, 0.5), y - 0.3, 0.05);\n      const rim = roundCyl(x, y - 0.3, z, 0.5, 0.05, 0.05);\n      return smin(roundCyl(x, y + 0.42, z, 0.52, 0.34, 0.16), smin(cone, rim, 0.05), 0.07);\n    }, { center: [0, -0.1, 0], seg: [160, 120] }),\n    new THREE.TorusGeometry(0.19, 0.075, 18, 56).translate(0.56, -0.4, 0)),\n  // one rounded carriage with three windows pressed into its side, on two soft wheels\n  train: () => shrinkWrap((x, y, z) => {\n    // a long body whose front end is a round nose\n    let d = smin(roundBox(x + 0.1, y, z, 0.88, 0.4, 0.4, 0.3), sph(x, y, z, 0.74, -0.02, 0, 0.42, 0.95, 0.98), 0.12);\n    for (const wx of [-0.56, -0.08, 0.4]) d = smax(d, -roundBox(x - wx, y - 0.08, z - 0.48, 0.18, 0.15, 0.17, 0.1), 0.035);\n    for (const wx of [-0.56, 0.5]) d = smin(d, sph(x, y, z, wx, -0.44, 0, 0.16, 1, 1.5), 0.05);\n    return d;\n  }, { center: [0, -0.05, 0], seg: [170, 120] }),\n  // a puffy keypad: six round keys on a soft base, one pressed down (each part wrapped on its own, so the gaps stay clean)\n  typing: () => {\n    const parts = [part((x, y, z) => roundBox(x, y + 0.3, z, 0.96, 0.15, 0.64, 0.14), [0, -0.3, 0])];\n    let i = 0;\n    for (const kz of [-0.24, 0.26]) for (const kx of [-0.6, 0, 0.6]) {\n      const ky = (i++ === 4 ? -0.08 : 0) - 0.02;\n      parts.push(part((x, y, z) => roundBox(x - kx, y - ky, z - kz, 0.21, 0.17, 0.18, 0.12), [kx, ky, kz], [70, 50]));\n    }\n    return merge(...parts).rotateX(0.62);\n  },\n  // an open book with one page lifting as it turns\n  page: () => {\n    // each leaf is a soft slab hinged at the spine\n    const leaf = (ang, w, t, d, ox, oy) => smooth(new RoundedBoxGeometry(w, t, d, 5, t / 2.2).translate(ox, oy, 0).rotateZ(ang).translate(0, -0.22, 0));\n    return merge(leaf(0.26, 0.96, 0.12, 1.2, -0.5, 0), leaf(-0.26, 0.96, 0.12, 1.2, 0.5, 0), leaf(1.05, 0.88, 0.06, 1.14, 0.46, 0.04)).rotateX(0.5);\n  },\n  // three soft blades around a hub, inside a thin guard ring\n  fan: () => merge(\n    shrinkWrap((x, y, z) => {\n      let d = sph(x, y, z, 0, 0, 0, 0.19, 1, 1.4);\n      for (let k = 0; k < 3; k++) {\n        const a = 0.35 + k * Math.PI * 2 / 3, [u, v] = rot2(x - Math.cos(a) * 0.46, y - Math.sin(a) * 0.46, a);\n        d = smin(d, (Math.hypot(u / 0.44, v / 0.27, z / 0.1) - 1) * 0.1, 0.12);\n      }\n      return d;\n    }, { center: [0, 0, 0], seg: [170, 120] }),\n    new THREE.TorusGeometry(0.98, 0.05, 16, 120)),\n  // an aeroplane window: a thick rounded frame, the pane, and clouds at dusk inside\n  cabin: () => {\n    // the frame is one soft tube around a rounded window, so it has no seams\n    const loop = roundRectShape(0.94, 1.32, 0.44).getSpacedPoints(180).map((p) => V3(p.x, p.y, 0));\n    const frame = smooth(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(loop, true), 240, 0.17, 28, true)).scale(1, 1, 1.25);\n    // the pane sits well behind the frame so the window reads as deep\n    const pane = smooth(new THREE.ExtrudeGeometry(roundRectShape(0.8, 1.18, 0.38), { depth: 0.03, bevelEnabled: true, bevelThickness: 0.015, bevelSize: 0.015, bevelSegments: 3, curveSegments: 48 }).translate(0, 0, -0.2));\n    return merge(frame, pane, cloudGeo(0.26).translate(-0.08, -0.32, -0.06), cloudGeo(0.17).translate(0.2, -0.16, -0.08));\n  },\n  // a small radio with a speaker pressed into its face, one dial and an antenna\n  static: () => merge(\n    shrinkWrap((x, y, z) => {\n      let d = roundBox(x, y, z, 0.8, 0.52, 0.34, 0.27);\n      d = smax(d, -roundCyl(x + 0.3, z - 0.42, y + 0.02, 0.27, 0.1, 0.05), 0.04);\n      return smin(d, sph(x, y, z, 0.44, 0.06, 0.32, 0.13, 1, 0.8), 0.05);\n    }, { center: [0, 0, 0], seg: [170, 120] }),\n    new THREE.CapsuleGeometry(0.035, 0.7, 6, 12).rotateZ(-0.5).translate(0.47, 0.81, -0.05),\n    new THREE.SphereGeometry(0.08, 24, 16).translate(0.66, 1.15, -0.05)),\n  // a soft, tall fridge with its door seam and two handles\n  // freezer and fridge doors as two soft blocks with a thin gap between them\n  hum: () => merge(\n    smooth(new RoundedBoxGeometry(1.04, 0.56, 0.84, 6, 0.26).translate(0, 0.6, 0)),\n    smooth(new RoundedBoxGeometry(1.04, 1.14, 0.84, 6, 0.3).translate(0, -0.29, 0)),\n    smooth(new RoundedBoxGeometry(0.09, 0.28, 0.1, 4, 0.044).translate(0.3, 0.58, 0.44)),\n    smooth(new RoundedBoxGeometry(0.09, 0.42, 0.1, 4, 0.044).translate(0.3, 0.06, 0.44))),\n};\n\n/* ---------- CITY combinations: what two or more city sounds become ----------\n   Keys list the sounds in NEW_TRACKS order (coffee, train, typing, page). Needs new-objects.js loaded first.\n   Every piece is convex or wrapped on its own, so shrinkWrap never has to see round a gap. */\nconst sdRoundRect2 = (x, y, bx, by, r) => { const qx = Math.abs(x) - bx + r, qy = Math.abs(y) - by + r; return Math.hypot(Math.max(qx, 0), Math.max(qy, 0)) + Math.min(Math.max(qx, qy), 0) - r; };\n// a flat 2D shape given thickness 2h and soft edges r\nconst slab = (d2, z, h, r) => { const wx = d2 + r, wy = Math.abs(z) - h + r; return Math.min(Math.max(wx, wy), 0) + Math.hypot(Math.max(wx, 0), Math.max(wy, 0)) - r; };\nconst rbox = (w, h, d, r, seg = 4) => smooth(new RoundedBoxGeometry(w, h, d, seg, r));\nconst cupGeo = (s) => merge(part((x, y, z) => roundCyl(x, y, z, 0.52, 0.34, 0.16), [0, 0, 0], [90, 70]), new THREE.TorusGeometry(0.19, 0.075, 16, 48).translate(0.56, 0.02, 0)).scale(s, s, s);\nconst steam = (s) => taperTube([[0, 0, 0], [0.09, 0.16, 0], [-0.07, 0.32, 0], [0.05, 0.48, 0]], (u) => 0.012 + 0.05 * (1 - u) * Math.min(1, u / 0.12 + 0.4), { T: 120, R: 16 }).scale(s, s, s);\n// a takeaway cup with a lid, wrapped as one shape so the see-through material never shows layers inside it (s = scale)\nconst takeaway = (cx, cy, cz, s = 1) => part((x, y, z) => {\n  const px = (x - cx) / s, py = (y - cy) / s, pz = (z - cz) / s, r = 0.13 + 0.045 * (py / 0.21);\n  const body = smax(Math.hypot(px, pz) - r, Math.abs(py) - 0.21, 0.035);\n  const lid = roundCyl(px, py - 0.225, pz, 0.168, 0.028, 0.02);\n  return smin(smin(body, lid, 0.015), sph(px, py, pz, 0, 0.25, 0, 0.085, 0.6), 0.02) * s;\n}, [cx, cy, cz], [100, 80]);\nconst bookBase = () => {\n  const leaf = (ang, w, t, d, ox, oy) => rbox(w, t, d, t / 2.2, 5).translate(ox, oy, 0).rotateZ(ang).translate(0, -0.22, 0);\n  return merge(leaf(0.26, 0.96, 0.12, 1.2, -0.5, 0), leaf(-0.26, 0.96, 0.12, 1.2, 0.5, 0), leaf(1.05, 0.88, 0.06, 1.14, 0.46, 0.04));\n};\n\nconst CITY_COMBOS = [\n  // \uc790\ud310\uae30 \ucee4\ud53c: the coffee machine on a station platform at dawn: a lit panel, a row of buttons, a paper cup steaming in the slot\n  { key: 'coffee+train', name: '\uc790\ud310\uae30 \ucee4\ud53c', body: '#fff4ee', rim: '#eedcd6', glowA: '#ffcf5e', posA: 0.64, radA: 0.38, glowB: '#c9784a', posB: 0.22, radB: 0.34,\n    shape: () => {\n      const F = 0.31;   // front face of the body\n      const paperCup = smooth(new THREE.CylinderGeometry(0.1, 0.072, 0.19, 36, 3).translate(0, -0.47, F + 0.12));\n      return merge(\n        rbox(0.92, 1.5, 0.62, 0.2, 6),\n        rbox(0.82, 0.16, 0.05, 0.05, 3).translate(0, 0.6, F),                      // the sign band on top\n        rbox(0.5, 0.56, 0.05, 0.07, 3).translate(-0.12, 0.2, F),                  // the lit panel of drinks\n        ...[0.38, 0.2, 0.02].map((by) => new THREE.SphereGeometry(0.055, 20, 14).scale(1, 1, 0.5).translate(0.3, by, F + 0.01)),\n        rbox(0.1, 0.05, 0.04, 0.02, 2).translate(0.3, -0.12, F + 0.01),           // the coin slot\n        rbox(0.44, 0.3, 0.12, 0.06, 3).translate(0, -0.42, F + 0.02),            // the hood over the cup slot\n        paperCup, steam(0.36).translate(0, -0.3, F + 0.12),\n        rbox(1.1, 0.06, 0.8, 0.03, 3).tr // extra signed distance helpers
const smax = (a, b, k) => -smin(-a, -b, k);
function roundBox(x, y, z, bx, by, bz, r) {
  const qx = Math.abs(x) - bx + r, qy = Math.abs(y) - by + r, qz = Math.abs(z) - bz + r;
  return Math.hypot(Math.max(qx, 0), Math.max(qy, 0), Math.max(qz, 0)) + Math.min(Math.max(qx, qy, qz), 0) - r;
}
// upright cylinder: radius r, half height h, edge radius rr
function roundCyl(x, y, z, r, h, rr) {
  const dx = Math.hypot(x, z) - r + rr, dy = Math.abs(y) - h + rr;
  return Math.min(Math.max(dx, dy), 0) + Math.hypot(Math.max(dx, 0), Math.max(dy, 0)) - rr;
}
// one convex piece, wrapped from its own centre
const part = (sdf, center, seg = [110, 80]) => shrinkWrap(sdf, { center, seg });
const rot2 = (a, b, t) => [a * Math.cos(t) + b * Math.sin(t), -a * Math.sin(t) + b * Math.cos(t)];
function roundRectShape(w, h, r) {
  const s = new THREE.Shape(), x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.absarc(x + w - r, y + r, r, -Math.PI / 2, 0); s.lineTo(x + w, y + h - r);
  s.absarc(x + w - r, y + h - r, r, 0, Math.PI / 2); s.lineTo(x + r, y + h); s.absarc(x + r, y + h - r, r, Math.PI / 2, Math.PI);
  s.lineTo(x, y + r); s.absarc(x + r, y + r, r, Math.PI, Math.PI * 1.5); return s;
}

/* ---------- CITY combinations: what two or more city sounds become ----------
   Keys list the sounds in NEW_TRACKS order (coffee, train, typing, page). Needs new-objects.js loaded first.
   Every piece is convex or wrapped on its own, so shrinkWrap never has to see round a gap. */
const sdRoundRect2 = (x, y, bx, by, r) => { const qx = Math.abs(x) - bx + r, qy = Math.abs(y) - by + r; return Math.hypot(Math.max(qx, 0), Math.max(qy, 0)) + Math.min(Math.max(qx, qy), 0) - r; };
// a flat 2D shape given thickness 2h and soft edges r
const slab = (d2, z, h, r) => { const wx = d2 + r, wy = Math.abs(z) - h + r; return Math.min(Math.max(wx, wy), 0) + Math.hypot(Math.max(wx, 0), Math.max(wy, 0)) - r; };
const rbox = (w, h, d, r, seg = 4) => smooth(new RoundedBoxGeometry(w, h, d, seg, r));
const cupGeo = (s) => merge(part((x, y, z) => roundCyl(x, y, z, 0.52, 0.34, 0.16), [0, 0, 0], [90, 70]), new THREE.TorusGeometry(0.19, 0.075, 16, 48).translate(0.56, 0.02, 0)).scale(s, s, s);
const steam = (s) => taperTube([[0, 0, 0], [0.09, 0.16, 0], [-0.07, 0.32, 0], [0.05, 0.48, 0]], (u) => 0.012 + 0.05 * (1 - u) * Math.min(1, u / 0.12 + 0.4), { T: 120, R: 16 }).scale(s, s, s);
// a takeaway cup with a lid, wrapped as one shape so the see-through material never shows layers inside it (s = scale)
const takeaway = (cx, cy, cz, s = 1) => part((x, y, z) => {
  const px = (x - cx) / s, py = (y - cy) / s, pz = (z - cz) / s, r = 0.13 + 0.045 * (py / 0.21);
  const body = smax(Math.hypot(px, pz) - r, Math.abs(py) - 0.21, 0.035);
  const lid = roundCyl(px, py - 0.225, pz, 0.168, 0.028, 0.02);
  return smin(smin(body, lid, 0.015), sph(px, py, pz, 0, 0.25, 0, 0.085, 0.6), 0.02) * s;
}, [cx, cy, cz], [100, 80]);

    const g = document.createElement('section'); g.className = 'group';
    const complete = have.length === keys.length && keys.length > 1;
    g.innerHTML = `<div class="group-head"><b>${gname}</b><span>${have.length} / ${keys.length}</span>${complete ? '<span>모두 모았어요</span>' : ''}</div>`;
    if (complete) {
      const hill = document.createElement('div'); hill.className = 'hill raised';
      hill.innerHTML = '<div class="inside"></div>' + `<div class="names">${keys.map(nameFor).join(', ')}</div>`;
      keys.forEach((k, i) => { const [x, y, w] = HILL_SPOTS[i % HILL_SPOTS.length]; hill.firstChild.insertAdjacentHTML('beforeend', `<img src="${thumb(k)}" alt="${nameFor(k)}" style="left:${x}%;top:${y}%;width:${w}%;animation-delay:${-i * 1.3}s;animation-duration:${5 + i}s">`); });
      g.appendChild(hill);
    } else {

      for (const k of keys) {
        const ok = found.includes(k), t = document.createElement('div');
        t.className = `tile ${ok ? 'raised' : 'sunken locked'}${gi === 3 ? ' wide' : ''}`;
        t.innerHTML = `<img src="${thumb(k)}" alt=""><b>${ok ? nameFor(k) : gi === 3 ? '네 가지 소리를 모두 켜면 나타나요' : '미발견'}</b>`;
        tiles.appendChild(t);
      }
      g.appendChild(tiles);
    }
    box.appendChild(g);
  });
}

/* ---------- swipe up: the app goes away, the sound stays ---------- */
const shell = $('#shell'), lock = $('#lock');
let lockOpen = false;
(() => {
  const zone = $('#swipe'); let y0 = 0, t0 = 0, dy = 0, live = false;
  zone.addEventListener('pointerdown', (e) => { live = true; y0 = e.clientY; t0 = performance.now(); dy = 0; shell.style.transition = 'none'; try { zone.setPointerCapture(e.pointerId); } catch (_) {} });
  zone.addEventListener('pointermove', (e) => {
    if (!live) return; dy = Math.min(0, e.clientY - y0);
    const k = Math.abs(dy);

    shell.style.borderRadius = Math.min(44, k / 4) + 'px';
  });
  const end = () => {
    if (!live) return; live = false;
    const v = dy / Math.max(1, performance.now() - t0);
    if (dy < -110 || v < -0.6) closeApp(); else { shell.style.transition = 'transform .6s var(--spring), border-radius .6s var(--soft)'; shell.style.transform = ''; shell.style.borderRadius = ''; }
  };
  zone.addEventListener('pointerup', end); zone.addEventListener('pointercancel', end);
  zone.addEventListener('click', () => {});
})();
const LOCK_BG = { nature: ['#0f1c34', '#1c1c42', '#2f2449'], city: ['#1e1a33', '#2c1f3e', '#3d2741'], noise: ['#0c1f29', '#12293a', '#1c2c46'] };
function closeApp() {

  shell.style.transition = 'transform .7s var(--soft), opacity .5s var(--soft), border-radius .6s var(--soft)';
  shell.style.transform = 'translateY(-62%) scale(.7)'; shell.style.opacity = '0'; shell.style.borderRadius = '44px';
  const [a, b, c] = LOCK_BG[state.theme]; lock.style.setProperty('--l-a', a); lock.style.setProperty('--l-b', b); lock.style.setProperty('--l-c', c);
  lockOpen = true; renderLock(); setTimeout(() => { lock.hidden = false; }, 180);
}
function openApp() {
  lockOpen = false; lock.hidden = true; $('#lockList').hidden = true;
  shell.style.transition = 'none'; shell.style.transform = 'translateY(-24%) scale(.86)'; shell.style.opacity = '0';
  requestAnimationFrame(() => requestAnimationFrame(() => { shell.style.transition = 'transform .8s var(--spring), opacity .45s var(--soft), border-radius .6s var(--soft)'; shell.style.transform = ''; shell.style.opacity = ''; shell.style.borderRadius = ''; }));
}
$('#openApp').addEventListener('click', openApp);
// comp only: swipe the lock screen up to come back to the app
(() => {
  let y0 = 0, t0 = 0, dy = 0, live = false;
  lock.addEventListener('pointerdown', (e) => {
    if (e.target.closest('button')) return;

  });
  lock.addEventListener('pointermove', (e) => {
    if (!live) return; dy = Math.min(0, e.clientY - y0);
    lock.style.transform = `translateY(${dy * 0.7}px)`; lock.style.opacity = String(1 - Math.min(0.6, -dy / 600));
  });
  const end = () => {
    if (!live) return; live = false;
    const v = dy / Math.max(1, performance.now() - t0);
    lock.style.transition = 'transform .55s var(--soft), opacity .5s var(--soft)';
    if (dy < -90 || v < -0.6) { lock.style.transform = 'translateY(-40%)'; lock.style.opacity = '0'; setTimeout(() => { openApp(); lock.style.transform = ''; lock.style.opacity = ''; }, 260); }
    else { lock.style.transform = ''; lock.style.opacity = ''; }
  };
  lock.addEventListener('pointerup', end); lock.addEventListener('pointercancel', end);
})();
const lockSub = () => (state.timerEnd ? `ONDA, ${fmt(state.timerEnd - Date.now())} 뒤에 꺼져요` : state.paused ? 'ONDA, 일시정지됨' : 'ONDA, 재생 중');
function renderLock() {
  const key = activeKey();
  const title = state.preset || (key ? nameFor(key) : '소리 없음');
  const img = key ? thumb(key) : `thumbs/icon-${state.theme}.webp`;
  $('#lockThumb').src = img; $('#lockArt').src = img; $('#lockTitle').textContent = title; $('#lockSub').textContent = lockSub();
  const d = new Date();
  $('#lockTime').textContent = `${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`;
  $('#lockDate').textContent = d.toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'long' });
  const box = $('#lockPresets'); box.innerHTML = '';
  for (const p of presetsOf(state.theme)) {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'preset' + (state.preset === p.name ? ' is-on' : '');
    b.innerHTML = `<img src="${thumb(p.icon)}" alt=""><span><b>${p.name}</b><small>${levelText(p.levels, state.theme)}</small></span>${state.preset === p.name ? icon('check').replace('<svg', '<svg class="check"') : ''}`;
    b.addEventListener('click', () => { applyPreset(p); toggleLockList(false); });
    box.appendChild(b);
  }
  renderTimerChoices($('#lockTimer'), () => { $('#lockSub').textContent = lockSub(); });
}
setInterval(() => { if (lockOpen) { const d = new Date(); $('#lockTime').textContent = `${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`; } }, 15000);
function toggleLockList(force) {
  const l = $('#lockList'), show = force ?? l.hidden;
  l.hidden = !show; document.querySelector('.lock-clock').style.opacity = show ? 0.45 : 1;
  if (show) { const pl = document.querySelector('.player'); l.style.top = 'auto'; l.style.bottom = (lock.clientHeight - pl.offsetTop + 12) + 'px'; }
}
$('#lockListBtn').addEventListener('click', () => toggleLockList());
function stepPreset(d) { const list = presetsOf(state.theme); const i = list.findIndex((p) => p.name === state.preset); applyPreset(list[(i + d + list.length) % list.length]); }
$('#prevPreset').addEventListener('click', () => stepPreset(-1));
$('#nextPreset').addEventListener('click', () => stepPreset(1));
function togglePause() {
  state.paused = !state.paused; sound.fadeTo(state.paused ? 0 : 1, 0.5);
  const b = $('#playPause'); setIcon(b, state.paused ? 'play' : 'pause'); b.setAttribute('aria-label', state.paused ? '재생' : '일시정지');
  if (lockOpen) $('#lockSub').textContent = lockSub();
}
$('#playPause').addEventListener('click', togglePause);

/* ---------- turn the object; a tap makes it bounce ---------- */
const userQ = new THREE.Quaternion(), turnV = V3(0, 0, 0), X_AXIS = V3(1, 0, 0), Y_AXIS = V3(0, 1, 0);
let turning = null, resetting = false;
function turnBy(axis, angle) { if (angle) userQ.premultiply(new THREE.Quaternion().setFromAxisAngle(axis, angle)).normalize(); }
function markTurned() { if (turnedOnce) return; turnedOnce = true; store.set('turned', true); capHint.style.opacity = 0; setTimeout(() => { capHint.hidden = true; capHint.style.opacity = ''; }, 600); }
canvas.addEventListener('pointerdown', (e) => {
  turning = { x: e.clientX, y: e.clientY, t: performance.now(), x0: e.clientX, y0: e.clientY, t0: performance.now(), moved: 0 }; resetting = false; turnV.set(0, 0, 0);
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  stage.classList.add('turning');
});
canvas.addEventListener('pointermove', (e) => {
  if (!turning) return;
  const now = performance.now(), dx = e.clientX - turning.x, dy = e.clientY - turning.y, len = Math.hypot(dx, dy);
  if (!len) return;
  turning.moved = Math.max(turning.moved, Math.hypot(e.clientX - turning.x0, e.clientY - turning.y0));
  if (turning.moved < 6) return;
  const axis = V3(dy / len, dx / len, 0), angle = len * (Math.PI / Math.max(240, stage.clientWidth * 0.6));
  turnBy(axis, angle); turnV.copy(axis).multiplyScalar(angle / Math.max(0.008, (now - turning.t) / 1000));
  Object.assign(turning, { x: e.clientX, y: e.clientY, t: now });
  if (main) main.hit.value = Math.max(main.hit.value, 0.15);
  markTurned();
});
const tapRay = new THREE.Raycaster(), tapNdc = V2(0, 0), tapHit = V3(0, 0, 0);
function tapped(ev) {
  if (!main || main.s < 0.05) return;
  const r = canvas.getBoundingClientRect();
  tapNdc.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  tapRay.setFromCamera(tapNdc, camera);
  if (tapRay.ray.intersectSphere(new THREE.Sphere(main.p, main.s * 1.05), tapHit)) { main.sqv += 9 * MO; main.hopV = BASE * 4.2 * MO + 0.4; main.hit.value = Math.min(1, main.hit.value + 0.6); }
}
const endTurn = (ev) => {
  if (!turning) return;
  if (ev && ev.type === 'pointerup' && turning.moved < 6 && performance.now() - turning.t0 < 350) tapped(ev);
  if (performance.now() - turning.t > 80 || reduceMotion) turnV.set(0, 0, 0);
  if (turnV.length() > 10) turnV.setLength(10);
  turning = null; stage.classList.remove('turning');
};
canvas.addEventListener('pointerup', endTurn); canvas.addEventListener('pointercancel', endTurn);
canvas.addEventListener('dblclick', () => { resetting = true; turnV.set(0, 0, 0); });

/* ---------- build shapes ahead of time, one per idle moment ---------- */
// building a shape is heavy on a phone, so it waits until the intro is over and then takes one shape at a time with a pause between
const warmQueue = [];
let warmReady = false;
function warm(t) {
  if (geoWorker) { THEMES[t].keys.forEach((k) => withGeo(k, () => {})); return; }   // the worker builds them in the background, in order
  warmQueue.unshift(...THEMES[t].keys.filter((k) => !geoCache[k]));
}
(function warmLoop() {
  if (geoWorker) return;
  if (warmReady) { const k = warmQueue.shift(); if (k && !geoCache[k]) { try { geoFor(k); } catch (e) { /* skip a shape that fails */ } } }
  setTimeout(() => (window.requestIdleCallback ? requestIdleCallback(warmLoop, { timeout: 2500 }) : warmLoop()), warmReady ? 600 : 500);
})();

/* ---------- loop ---------- */
const clock = new THREE.Clock(), idleE = new THREE.Euler(), ID = new THREE.Quaternion(), tmpV = V3(0, 0, 0);
let rendered = false;
/* ---------- the sound turns with the object ---------- */
// the object's face is what sounds: spread across it, turned with it, heard from where it now points.
// three.js has +z toward the viewer and audio has -z in front, so z flips on the way out
let spaceKey = null; const spaceQ = new THREE.Quaternion(), spaceV = V3(0, 0, 0);
function syncSpace() {
  const key = activeKey();
  if (key === spaceKey && userQ.angleTo(spaceQ) < 0.004) return;
  spaceKey = key; spaceQ.copy(userQ);
  const on = key ? key.split('+') : [], span = [0, 0, 0.6, 0.85, 1.05][on.length] || 0;   // half the arc in radians
  on.forEach((id, i) => {
    const az = on.length > 1 ? -span + (2 * span * i) / (on.length - 1) : 0;
    spaceV.set(Math.sin(az), 0, Math.cos(az)).applyQuaternion(userQ);
    sound.place(id, spaceV.x, spaceV.y, -spaceV.z);
  });
}
let frameNo = 0, popFrames = 0, lastDraw = 0, slowAvg = 0, lastDrop = 0, pixelRatio = Math.min(devicePixelRatio, 1.5);
function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 1 / 30), t = clock.elapsedTime;
  syncSpace();
  // nothing of the 3D space is visible: keep only the sliders moving
  if (document.hidden || lockOpen || !col.hidden) { for (const s of [...activeSliders]) if (!s.tick(dt)) activeSliders.delete(s); return; }
  U.time.value = t * MO;
  for (const s of [...activeSliders]) if (!s.tick(dt)) activeSliders.delete(s);
  if (resetting) { userQ.slerp(ID, Math.min(1, dt * 5)); if (userQ.angleTo(ID) < 0.002) { userQ.identity(); resetting = false; } }
  else if (!turning && turnV.lengthSq() > 1e-6) { const sp = turnV.length(); turnBy(tmpV.copy(turnV).divideScalar(sp), sp * dt); turnV.multiplyScalar(Math.exp(-dt * 2.4)); }
  for (const e of [...ents]) {
    e.t += dt;
    if (e.mode === 'launch') {
      tmpV.copy(CENTER).sub(e.p).multiplyScalar(11).addScaledVector(e.v, -4.2);
      e.v.addScaledVector(tmpV, dt); e.p.addScaledVector(e.v, dt);
      if ((e.t > 0.5 && e.p.distanceTo(CENTER) < BASE * 0.5) || e.t > 1.4) arrive(e);
    } else if (e.mode === 'absorb') {
      e.p.lerp(e.target, Math.min(1, dt * 7));
    } else if (e.mode === 'leave') {
      e.v.y -= 14 * dt; e.p.addScaledVector(e.v, dt); e.p.x += (slotX(e.key) - e.p.x) * Math.min(1, dt * 3);
      if (e.p.y < -VH - BASE * 1.2) { removeEntity(e); continue; }
    } else if (e.mode === 'main') {
      e.ts = mainScale();
      e.p.x += (CENTER.x - e.p.x) * Math.min(1, dt * 4);
      e.p.y += (CENTER.y + Math.sin(t * 0.8 + e.phase) * 0.06 * MO - e.p.y) * Math.min(1, dt * 4);
    }
    const k = e.mode === 'absorb' ? 220 : 130, c = e.mode === 'absorb' ? 28 : 10;
    e.sv += (-k * (e.s - e.ts) - c * e.sv) * dt; e.s = Math.max(0, e.s + e.sv * dt);
    if (e.mode === 'absorb' && e.s < 0.01 && e.t > 0.2) { removeEntity(e); continue; }
    if (e.hop > 0 || e.hopV !== 0) { e.hopV -= BASE * 22 * dt; e.hop += e.hopV * dt; if (e.hop <= 0) { e.hop = 0; if (e.hopV < -0.5) e.sqv += Math.min(8, -e.hopV * 1.6) * MO; e.hopV = 0; } }
    e.sqv += (-170 * e.sq - 9 * e.sqv) * dt; e.sq = clamp(e.sq + e.sqv * dt, -0.35, 0.45);
    e.holder.position.set(e.p.x, e.p.y + e.hop, e.p.z);
    const sz = Math.max(e.s, 1e-4);
    e.holder.scale.set(sz * (1 + 0.18 * e.sq), sz * (1 - 0.28 * e.sq), sz * (1 + 0.18 * e.sq));
    e.holder.visible = e.s > 0.002;
    idleE.set(0, Math.sin(t * 0.35 + e.phase) * 0.4 * MO, Math.sin(t * 0.27 + e.phase) * 0.06 * MO);
    e.spin.quaternion.setFromEuler(idleE).premultiply(userQ);
    e.hit.value *= Math.exp(-dt * 1.8);
    e.amp.value = MO * 0.8;
  }
  // the object only drifts when nobody touches it: half the frames are enough, and the interface keeps the other half.
  // under a popup it is blurred away, so a still picture lets the browser reuse the blur
  frameNo++;
  const calm = !turning && !resetting && ents.every((e) => e.mode === 'main' && Math.abs(e.sv) < 0.02 && e.hop === 0 && Math.abs(e.sqv) < 0.05 && e.hit.value < 0.02);
  popFrames = openPop ? popFrames + 1 : 0;
  if (rendered && calm && (popFrames > 40 || frameNo % 2)) return;
  renderer?.render(scene, camera); rendered = true;
  // a phone that still cannot keep up gets fewer pixels, one step at a time
  const now = performance.now(), gap = now - lastDraw; lastDraw = now;
  if (renderer && gap < 200) {
    slowAvg += (gap - slowAvg) * 0.04;
    if (slowAvg > 40 && now - lastDrop > 2500 && pixelRatio > 1) { pixelRatio = Math.max(1, pixelRatio - 0.25); renderer.setPixelRatio(pixelRatio); size(); lastDrop = now; slowAvg = 0; }
  }
}

/* ---------- start ---------- */
renderRows(); setCaption(''); warm(state.theme); loop();
// lift the fog after a short hold; fonts get at most a second longer, never an endless wait
const fontsOrTimeout = Promise.race([document.fonts?.ready ?? Promise.resolve(), new Promise((r) => setTimeout(r, 2500))]);
Promise.all([fontsOrTimeout, new Promise((r) => setTimeout(r, reduceMotion ? 300 : 1500))]).then(() => {
  window.__ondaLift ? window.__ondaLift() : $('#intro')?.remove();
  setTimeout(() => { warmReady = true; }, 2600);
});
}
